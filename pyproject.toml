version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "BADR EDDINE TOUBANI", email = "158719657+toubani12@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
